name: Blue Water Autonomy
description: >-
  Blue Water Autonomy is a Boston-based defense technology company building
  autonomous warships for open-ocean operations, with the goal of revitalizing
  U.S. shipbuilding through scalable, reliable, uncrewed naval vessels. Founded
  in 2025 by Rylan Hamilton (ex-U.S. Navy officer and founder of 6 River Systems),
  Scott N. Miller (ocean engineer and early iRobot engineer), and Austin Gray
  (former Navy intelligence officer), the company unveiled its 190-foot Liberty
  Class autonomous ship platform for the U.S. Navy in February 2026. Backed by a
  $50M Series A led by GV, Blue Water Autonomy operates from offices in Boston MA,
  Washington DC, Morgan City LA, and San Diego CA. This is a company profile in
  the API Evangelist network; the company publishes no public API, developer
  portal, or SDK surface as of this enrichment pass.
